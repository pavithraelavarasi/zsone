<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: #e0ded6;
      --text: #1a1917;
      --text-muted: #72706b;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page-header {
      max-width: 900px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .layout {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    /* --- Summary stats --- */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
    }

    .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 1.3rem; font-weight: 600; color: var(--text); }
    .stat-value.green { color: var(--success); }

    /* --- Category breakdown --- */
    .cat-list { list-style: none; }
    .cat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .cat-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cat-name { font-size: 0.875rem; flex: 1; }
    .cat-amount { font-size: 0.875rem; font-weight: 500; }
    .cat-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 4px;
    }
    .cat-bar { height: 4px; border-radius: 2px; }

    /* --- Form --- */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 5px; color: var(--text-muted); }

    input, select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 0.65rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-sm {
      padding: 0.3rem 0.65rem;
      font-size: 0.78rem;
      width: auto;
      border-radius: var(--radius-sm);
    }
    .btn-danger { background: var(--danger); }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--accent-light); }

    /* --- Expense list --- */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .filter-row select, .filter-row input { flex: 1; }

    .expense-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }
    .expense-item:last-child { border-bottom: none; }

    .expense-icon {
      width: 38px; height: 38px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .expense-info { flex: 1; min-width: 0; }
    .expense-desc {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .expense-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .expense-amount {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--danger);
      white-space: nowrap;
    }

    .expense-actions { display: flex; gap: 6px; }

    .empty-state {
      text-align: center;
      padding: 2.5rem 0;
      color: var(--text-muted);
    }
    .empty-state svg { margin-bottom: 0.75rem; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; }

    /* --- Toast --- */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--text);
      color: #fff;
      padding: 0.65rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    /* edit mode */
    .editing-banner {
      background: var(--warning-light);
      border: 1px solid #fcd34d;
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.85rem;
      font-size: 0.8rem;
      color: var(--warning);
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="logo">💰</div>
  <div>
    <h1>Expense Tracker</h1>
    <div class="subtitle">Track. Analyse. Save.</div>
  </div>
</div>

<div class="layout">

  <!-- LEFT: Add Form + Summary -->
  <div>
    <!-- Add/Edit Form -->
    <div class="card" style="margin-bottom: 1.5rem;">
      <div class="card-title" id="form-title">Add expense</div>
      <div class="editing-banner" id="edit-banner">
        ✏️ Editing expense — <a href="#" id="cancel-edit" style="color:var(--warning);font-weight:600;">Cancel</a>
      </div>

      <div class="form-group">
        <label for="desc">Description</label>
        <input id="desc" type="text" placeholder="e.g. Lunch at canteen" />
      </div>
      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="Food">🍛 Food</option>
          <option value="Travel">🚌 Travel</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Health">💊 Health</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Education">📚 Education</option>
          <option value="Utilities">💡 Utilities</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" type="date" />
      </div>
      <button class="btn" id="submit-btn" onclick="submitExpense()">Add Expense</button>
    </div>

    <!-- Summary -->
    <div class="card">
      <div class="card-title">Summary</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total spent</div>
          <div class="stat-value" id="total-amount">₹0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Transactions</div>
          <div class="stat-value" id="total-count">0</div>
        </div>
        <div class="stat" style="grid-column: span 2;">
          <div class="stat-label">Top category</div>
          <div class="stat-value green" id="top-cat">—</div>
        </div>
      </div>

      <div class="card-title" style="margin-bottom: 0.75rem;">By category</div>
      <ul class="cat-list" id="cat-breakdown">
        <li style="color: var(--text-muted); font-size: 0.85rem;">No data yet.</li>
      </ul>
    </div>
  </div>

  <!-- RIGHT: Expense list -->
  <div class="card">
    <div class="list-header">
      <div class="card-title" style="margin-bottom:0;">All expenses</div>
    </div>
    <div class="filter-row">
      <select id="filter-cat" onchange="renderList()">
        <option value="">All categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Education">Education</option>
        <option value="Utilities">Utilities</option>
        <option value="Other">Other</option>
      </select>
      <input id="search" type="text" placeholder="Search..." oninput="renderList()" />
    </div>

    <div id="expense-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = 'http://localhost:8080/api';

  const CATEGORY_META = {
    'Food':          { icon: '🍛', color: '#f59e0b', bg: '#fffbeb' },
    'Travel':        { icon: '🚌', color: '#3b82f6', bg: '#eff6ff' },
    'Shopping':      { icon: '🛍️', color: '#8b5cf6', bg: '#f5f3ff' },
    'Health':        { icon: '💊', color: '#10b981', bg: '#f0fdf4' },
    'Entertainment': { icon: '🎬', color: '#ec4899', bg: '#fdf2f8' },
    'Education':     { icon: '📚', color: '#0ea5e9', bg: '#f0f9ff' },
    'Utilities':     { icon: '💡', color: '#f97316', bg: '#fff7ed' },
    'Other':         { icon: '📦', color: '#6b7280', bg: '#f3f4f6' },
  };

  let expenses = [];
  let editingId = null;

  // Set today's date as default
  document.getElementById('date').value = new Date().toISOString().split('T')[0];

  async function fetchExpenses() {
    try {
      const res = await fetch(`${API}/expenses`);
      expenses = await res.json();
    } catch {
      // Backend not running — use local demo data
      if (expenses.length === 0) {
        expenses = [
          { id: 1, description: 'Canteen lunch', amount: 85, category: 'Food', date: '2026-06-20' },
          { id: 2, description: 'Bus pass', amount: 500, category: 'Travel', date: '2026-06-18' },
          { id: 3, description: 'Notebook & pen', amount: 120, category: 'Education', date: '2026-06-17' },
        ];
      }
    }
    renderList();
    renderSummary();
  }

  async function submitExpense() {
    const desc = document.getElementById('desc').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const date = document.getElementById('date').value;

    if (!desc || isNaN(amount) || amount <= 0 || !date) {
      showToast('Please fill all fields correctly.');
      return;
    }

    const payload = { description: desc, amount, category, date };

    try {
      if (editingId !== null) {
        const res = await fetch(`${API}/expenses/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const updated = await res.json();
        expenses = expenses.map(e => e.id === editingId ? updated : e);
        showToast('Expense updated.');
        cancelEdit();
      } else {
        const res = await fetch(`${API}/expenses`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const created = await res.json();
        expenses.unshift(created);
        showToast('Expense added.');
      }
    } catch {
      // Offline mode
      if (editingId !== null) {
        expenses = expenses.map(e => e.id === editingId ? { id: editingId, ...payload } : e);
        showToast('Updated (offline mode).');
        cancelEdit();
      } else {
        const id = Date.now();
        expenses.unshift({ id, ...payload });
        showToast('Added (offline mode).');
      }
    }

    clearForm();
    renderList();
    renderSummary();
  }

  async function deleteExpense(id) {
    try {
      await fetch(`${API}/expenses/${id}`, { method: 'DELETE' });
    } catch {}
    expenses = expenses.filter(e => e.id !== id);
    renderList();
    renderSummary();
    showToast('Expense deleted.');
  }

  function startEdit(id) {
    const e = expenses.find(x => x.id === id);
    if (!e) return;
    editingId = id;
    document.getElementById('desc').value = e.description;
    document.getElementById('amount').value = e.amount;
    document.getElementById('category').value = e.category;
    document.getElementById('date').value = e.date;
    document.getElementById('form-title').textContent = 'Edit expense';
    document.getElementById('edit-banner').style.display = 'block';
    document.getElementById('submit-btn').textContent = 'Update Expense';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    clearForm();
    document.getElementById('form-title').textContent = 'Add expense';
    document.getElementById('edit-banner').style.display = 'none';
    document.getElementById('submit-btn').textContent = 'Add Expense';
  }

  document.getElementById('cancel-edit').onclick = (e) => { e.preventDefault(); cancelEdit(); };

  function clearForm() {
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
  }

  function renderList() {
    const filterCat = document.getElementById('filter-cat').value;
    const search = document.getElementById('search').value.toLowerCase();
    const container = document.getElementById('expense-list');

    let filtered = expenses.filter(e => {
      const matchCat = !filterCat || e.category === filterCat;
      const matchSearch = !search || e.description.toLowerCase().includes(search);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M9 14l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
          </svg>
          <p>No expenses found.</p>
        </div>`;
      return;
    }

    container.innerHTML = filtered.map(e => {
      const meta = CATEGORY_META[e.category] || CATEGORY_META['Other'];
      const dateStr = new Date(e.date + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      return `
        <div class="expense-item">
          <div class="expense-icon" style="background:${meta.bg}; font-size:18px;">${meta.icon}</div>
          <div class="expense-info">
            <div class="expense-desc">${escapeHtml(e.description)}</div>
            <div class="expense-meta">
              <span class="tag" style="background:${meta.bg}; color:${meta.color};">${e.category}</span>
              &nbsp;${dateStr}
            </div>
          </div>
          <div class="expense-amount">−₹${Number(e.amount).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
          <div class="expense-actions">
            <button class="btn btn-sm btn-ghost" onclick="startEdit(${e.id})" title="Edit">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteExpense(${e.id})" title="Delete">🗑️</button>
          </div>
        </div>`;
    }).join('');
  }

  function renderSummary() {
    const total = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
    document.getElementById('total-amount').textContent = '₹' + total.toLocaleString('en-IN', { maximumFractionDigits: 2 });
    document.getElementById('total-count').textContent = expenses.length;

    const byCategory = {};
    expenses.forEach(e => {
      byCategory[e.category] = (byCategory[e.category] || 0) + Number(e.amount);
    });

    const cats = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
    const topCat = cats[0];
    document.getElementById('top-cat').textContent = topCat ? `${CATEGORY_META[topCat[0]]?.icon || ''} ${topCat[0]}` : '—';

    const catList = document.getElementById('cat-breakdown');
    if (cats.length === 0) {
      catList.innerHTML = '<li style="color: var(--text-muted); font-size: 0.85rem;">No data yet.</li>';
      return;
    }

    catList.innerHTML = cats.map(([cat, amt]) => {
      const meta = CATEGORY_META[cat] || CATEGORY_META['Other'];
      const pct = total > 0 ? (amt / total * 100).toFixed(1) : 0;
      return `
        <li class="cat-item">
          <span class="cat-dot" style="background:${meta.color};"></span>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="cat-name">${meta.icon} ${cat}</span>
              <span class="cat-amount">₹${Number(amt).toLocaleString('en-IN', {maximumFractionDigits:2})}</span>
            </div>
            <div class="cat-bar-wrap">
              <div class="cat-bar" style="width:${pct}%; background:${meta.color};"></div>
            </div>
          </div>
        </li>`;
    }).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  fetchExpenses();
</script>
</body>
</html>
